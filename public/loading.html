<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>JA Proyección — Iniciando</title>
        <style>
            *, *::before, *::after { box-sizing: border-box; }
            html, body {
                margin: 0;
                height: 100%;
                width: 100%;
                background: transparent;
                color: #f7fbff;
                font-family: "Segoe UI", Arial, sans-serif;
            }
            main {
                width: 100%;
                height: 100%;
                min-width: 0;
                padding: 12px 24px 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                overflow: hidden;
                position: relative;
                border-radius: 12px;
                background: radial-gradient(ellipse at 52% -25%, #2563a0 0%, #163958 47%, #091b30 100%);
                border: 1px solid rgba(99, 161, 218, 0.25);
                -webkit-app-region: drag;
            }
            .brand {
                display: block;
                flex: none;
                width: 190px;
                height: 129px;
                max-width: 56%;
                object-fit: cover;
                object-position: center;
                filter: drop-shadow(0 5px 12px rgba(0, 0, 0, 0.25));
            }
            h1 {
                width: 100%;
                padding: 0;
                margin: 0;
                white-space: nowrap;
                text-align: center;
                font-size: clamp(22px, 7vw, 35px);
                font-weight: 750;
                letter-spacing: -0.035em;
                line-height: 1.2;
            }
            h1 strong { color: #ffd036; font-weight: 800; }
            .tagline {
                font-size: 11px;
                color: #d6e2f0;
                text-align: center;
                white-space: nowrap;
                margin: 2px 0 6px;
            }
            .progress {
                width: min(265px, 78%);
                height: 4px;
                margin-top: 5px;
                background: #274969;
                border-radius: 8px;
                position: relative;
                overflow: hidden;
            }
            .progress::after {
                content: "";
                position: absolute;
                inset: 0;
                width: 35%;
                background: linear-gradient(90deg, #e8ab0c, #ffdb3d);
                border-radius: inherit;
                animation: load 1.8s ease-in-out infinite alternate;
            }
            .bottom {
                width: 100%;
                display: flex;
                justify-content: center;
                gap: 10px;
                font-size: 10px;
                margin-top: 3px;
                color: #bac9d9;
            }
            @keyframes load {
                from { transform: translateX(-100%); }
                to { transform: translateX(300%); }
            }
            @media (max-height: 235px) {
                .brand { width: 145px; height: 96px; }
                main { gap: 2px; padding: 7px; }
                .tagline { margin: 0; }
            }
        </style>
    </head>
    <body>
        <main>
            <img class="brand" src="./ja-logo.png" alt="Emblema JA" draggable="false" />
            <h1>JA <strong>Proyección</strong></h1>
            <p class="tagline">Presentaciones que inspiran</p>
            <div class="progress" role="progressbar" aria-label="Iniciando JA Proyección"></div>
            <div class="bottom"><span>Iniciando…</span><span>v<span class="version">0.0.0</span></span></div>
        </main>
        <script>
            const { ipcRenderer } = require("electron")
            ipcRenderer.send("MAIN", { channel: "VERSION" })
            ipcRenderer.once("MAIN", (_event, message) => {
                if (message.channel === "VERSION" && message.data) {
                    document.querySelector(".version").textContent = String(message.data)
                }
            })
        </script>
    </body>
</html>
